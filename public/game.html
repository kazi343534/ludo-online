<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Online - Game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ccircle cx='32' cy='32' r='10' fill='white'/%3E%3Ccircle cx='68' cy='68' r='10' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="game-body">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-badge">★</span>
        <span class="brand-name">LUDO</span>
      </div>
      <div class="room-info">
        <span class="label">Room</span>
        <span id="roomCode" class="code">------</span>
        <button id="copyBtn" class="mini-btn" title="Copy room code">Copy</button>
      </div>
    </div>
    <button id="leaveBtn" class="mini-btn danger">Leave</button>
  </header>

  <main class="game-main">
    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>

    <section id="videoCard" class="video-card">
      <div class="video-head">
        <span class="video-title"><span class="live-dot"></span> Cameras</span>
        <span id="videoCount" class="video-count">0 live</span>
      </div>
      <div id="videoTiles" class="video-tiles"></div>
      <div class="video-controls">
        <button id="joinVideoBtn" class="btn primary video-join">Join Video &amp; Mic</button>
        <button id="camBtn" class="mini-btn video-btn hidden">Camera On</button>
        <button id="micBtn" class="mini-btn video-btn hidden">Mic On</button>
        <button id="leaveVideoBtn" class="mini-btn danger hidden">Leave</button>
      </div>
      <p id="videoHint" class="video-hint">Optional: join video to see and hear each other.</p>
    </section>

    <aside class="side">
      <div id="turnBanner" class="turn-banner">
        <div class="turn-trough">
          <span class="turn-fill" aria-hidden="true"></span>
          <span id="turnDot" class="turn-dot hidden"></span>
          <span id="turnText" class="turn-text">Connecting…</span>
          <span id="turnClock" class="turn-clock hidden">30s</span>
        </div>
        <span class="turn-hourglass" aria-hidden="true">
          <svg viewBox="0 0 24 38" width="26" height="40">
            <defs>
              <linearGradient id="hgFrame" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff8cf" />
                <stop offset="0.42" stop-color="#ffd700" />
                <stop offset="0.7" stop-color="#8a6a1a" />
                <stop offset="1" stop-color="#eef5ff" />
              </linearGradient>
              <linearGradient id="hgSand" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#d8feff" />
                <stop offset="0.55" stop-color="#00f6ff" />
                <stop offset="1" stop-color="#007c96" />
              </linearGradient>
            </defs>
            <path d="M4.5 3.5h15M4.5 34.5h15" stroke="url(#hgFrame)" stroke-width="3.2" stroke-linecap="round" />
            <path d="M6 5c0 6 6 8 6 14s-6 8-6 14h12c0-6-6-8-6-14s6-8 6-14z" fill="rgba(0,246,255,0.08)" stroke="url(#hgFrame)" stroke-width="1.7" stroke-linejoin="round" />
            <path d="M8.2 6.6h7.6c0 4.2-3.8 6-3.8 9.2s3.8 5 3.8 9.2H8.2c0-4.2 3.8-6 3.8-9.2s-3.8-5-3.8-9.2z" fill="url(#hgSand)" opacity="0.9" />
            <path d="M9.4 31.4h5.2L12 26.6z" fill="#b9fdff" />
            <circle cx="12" cy="18.4" r="1.2" fill="#ffffff" />
          </svg>
        </span>
      </div>

      <div class="dice-area">
        <div id="dice" class="dice dice-roll-box" data-value="5" role="img" aria-label="Dice showing 5">
          <div class="dice-cube">
            <span class="dice-edge dice-edge-cyan" aria-hidden="true"></span>
            <span class="dice-edge dice-edge-magenta" aria-hidden="true"></span>
            <div class="dice-face">
              <div id="dicePips" class="dice-pips" aria-hidden="true">
                <span class="dice-pip pip-1"></span>
                <span class="dice-pip pip-3"></span>
                <span class="dice-pip pip-5"></span>
                <span class="dice-pip pip-7"></span>
                <span class="dice-pip pip-9"></span>
              </div>
            </div>
          </div>
        </div>
        <button id="rollBtn" class="btn primary big" disabled>Roll Dice</button>
      </div>

      <div id="playersPanel" class="players-panel"></div>

      <div id="reactionBar" class="reaction-bar" aria-label="Quick reactions">
        <button type="button" data-text="LOL!">LOL!<span class="emoji" aria-hidden="true">😂</span></button>
        <button type="button" data-text="WOW!">WOW!<span class="emoji" aria-hidden="true">😮</span></button>
        <button type="button" data-text="NO!">NO!<span class="emoji" aria-hidden="true">😤</span></button>
        <button type="button" data-text="GG!">GG!<span class="emoji" aria-hidden="true">🎉</span></button>
      </div>

      <div id="adminPanel" class="admin-panel hidden">
        <span class="admin-corner tl"></span>
        <span class="admin-corner tr"></span>
        <span class="admin-corner bl"></span>
        <span class="admin-corner br"></span>
        <div class="admin-head">
          <span>Admin Dice Control</span>
          <label class="switch">
            <input type="checkbox" id="forceToggle">
            <span class="slider"></span>
          </label>
        </div>
        <p class="admin-hint">When ON, your next roll uses the number you pick.<br>Other players cannot see this.</p>
        <div id="forceNumbers" class="force-numbers"></div>
        <div id="forceStatus" class="admin-status">Force mode OFF</div>
      </div>

      <div id="statusMsg" class="status-msg"></div>
    </aside>
  </main>

  <div id="lobbyOverlay" class="overlay">
    <div class="overlay-card">
      <h2>Lobby</h2>
      <p class="hint">Share this room code: <strong id="lobbyCode" class="code">------</strong></p>
      <div id="lobbyPlayers" class="lobby-players"></div>
      <p id="lobbyHint" class="hint"></p>
      <button id="startBtn" class="btn primary hidden">Start Game</button>
    </div>
  </div>

  <div id="winOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="winTitle">Winner!</h2>
      <div class="overlay-actions">
        <button id="restartBtn" class="btn primary hidden">Play Again</button>
        <button id="homeBtn" class="btn">Home</button>
      </div>
    </div>
  </div>

  <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

  <script src="/rtc-config.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/client.js"></script>
</body>
</html>
