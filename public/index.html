<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Online</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ccircle cx='32' cy='32' r='10' fill='white'/%3E%3Ccircle cx='68' cy='68' r='10' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="landing-body">
  <main class="landing">
    <h1 class="logo">LUDO<span>ONLINE</span></h1>
    <p class="tagline">Play Ludo with friends over the internet.</p>

    <section class="card">
      <label for="name">Your name</label>
      <input id="name" maxlength="16" placeholder="Enter your name" autocomplete="off">
    </section>

    <section class="card">
      <button id="createBtn" class="btn primary block">Create Room</button>
      <div class="divider"><span>or join a room</span></div>
      <label for="code">Room code</label>
      <div class="join-row">
        <input id="code" maxlength="6" placeholder="123456" inputmode="numeric" autocomplete="off">
        <button id="joinBtn" class="btn">Join</button>
      </div>
    </section>

    <p id="status" class="status"></p>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/landing.js"></script>
</body>
</html>
